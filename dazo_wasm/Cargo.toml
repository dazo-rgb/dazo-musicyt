[package]
name = "dazo_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "HtmlButtonElement",
  "HtmlInputElement", "HtmlAudioElement", "HtmlCanvasElement", "HtmlImageElement",
  "CanvasRenderingContext2d", "AudioContext", "MediaElementAudioSourceNode",
  "AnalyserNode", "BiquadFilterNode", "BiquadFilterType", "AudioDestinationNode",
  "AudioParam", "Storage", "EventTarget", "Event", "MouseEvent", "KeyboardEvent",
  "Response", "console", "DomTokenList"
]
