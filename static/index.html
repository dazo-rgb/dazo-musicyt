<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dazo Hi-Res Audio Player</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container app-container glass-panel">
      <h1 class="text-center fw-bold mb-1" style="letter-spacing: -1px">
        Dazo Music <span class="badge-premium">PRO</span>
      </h1>
      <p class="text-center text-white-50 small mb-4">Auto-Queue • Custom Playback • Live Lyrics</p>

      <div class="input-group shadow-sm">
        <input
          type="text"
          id="searchInput"
          class="form-control search-input bg-dark text-white"
          placeholder="Ketik judul lagu dan tekan Enter..."
        />
        <button class="btn btn-success search-btn" type="button" id="searchBtn">Cari Lagu</button>
      </div>
      <div id="statusText" class="text-white-50 text-center small fw-bold mt-3"></div>

      <div class="search-results" id="searchResultsContainer">
        <h6 class="text-white-50 border-bottom border-secondary pb-2 mb-3">Hasil Pencarian</h6>
        <div id="resultsList"></div>
      </div>

      <div class="player-layout" id="playerSection" style="display: none">
        <div class="player-main">
          <div class="now-playing-card">
            <img
              id="npCover"
              class="cover-art-large"
              src=""
              alt="Album Cover"
              crossorigin="anonymous"
            />
            <div id="npTitle" class="fw-bold fs-5 mb-1 text-truncate">Judul Lagu</div>
            <p class="text-white-50 small mb-0">Opus Hi-Res Stream</p>

            <canvas id="visualizerCanvas"></canvas>

            <div class="playback-controls">
              <div class="progress-container">
                <span id="currentTimeDisplay">0:00</span>
                <div class="progress-bar-wrapper" id="progressBarWrapper">
                  <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="durationDisplay">0:00</span>
              </div>

              <div class="main-controls">
                <button class="play-pause-btn" id="playPauseBtn">⏸</button>
                <button class="next-btn" id="nextTrackBtn" title="Lagu Selanjutnya">⏭</button>
              </div>

              <!-- Volume Slider Baru -->
              <div
                class="volume-container mt-3 d-flex align-items-center justify-content-center gap-2"
              >
                <span style="font-size: 0.8rem; color: #aaa">🔈</span>
                <input
                  type="range"
                  id="volumeSlider"
                  min="0"
                  max="1"
                  step="0.01"
                  value="1"
                  style="width: 100px; height: 4px; accent-color: #1db954"
                />
                <span style="font-size: 0.8rem; color: #aaa">🔊</span>
              </div>
            </div>

            <audio id="audioPlayer" crossorigin="anonymous"></audio>

            <button class="btn btn-sm btn-outline-light mt-4 rounded-pill px-3" id="toggleEqBtn">
              🎛️ DSP Equalizer
            </button>

            <div class="eq-panel" id="eqPanel">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold text-white small">Equalizer</span>
                <select
                  class="form-select form-select-sm bg-dark text-white border-secondary"
                  style="width: auto; font-size: 0.75rem"
                  id="eqPreset"
                >
                  <option value="flat">Flat</option>
                  <option value="bass">Bass Boost</option>
                  <option value="vocal">Vokal Jernih</option>
                  <option value="vshape">V-Shape</option>
                </select>
              </div>
              <div class="eq-slider-container">
                <div class="eq-band">
                  <input
                    type="range"
                    orient="vertical"
                    class="eq-slider"
                    id="eq-60"
                    min="-12"
                    max="12"
                    value="0"
                  /><span class="eq-label">60Hz</span>
                </div>
                <div class="eq-band">
                  <input
                    type="range"
                    orient="vertical"
                    class="eq-slider"
                    id="eq-230"
                    min="-12"
                    max="12"
                    value="0"
                  /><span class="eq-label">230Hz</span>
                </div>
                <div class="eq-band">
                  <input
                    type="range"
                    orient="vertical"
                    class="eq-slider"
                    id="eq-910"
                    min="-12"
                    max="12"
                    value="0"
                  /><span class="eq-label">910Hz</span>
                </div>
                <div class="eq-band">
                  <input
                    type="range"
                    orient="vertical"
                    class="eq-slider"
                    id="eq-3k"
                    min="-12"
                    max="12"
                    value="0"
                  /><span class="eq-label">3kHz</span>
                </div>
                <div class="eq-band">
                  <input
                    type="range"
                    orient="vertical"
                    class="eq-slider"
                    id="eq-14k"
                    min="-12"
                    max="12"
                    value="0"
                  /><span class="eq-label">14kHz</span>
                </div>
              </div>
            </div>

            <div class="queue-section" id="queueSection">
              <div class="queue-header">Akan Diputar Selanjutnya:</div>
              <div id="queueList"></div>
            </div>
          </div>
        </div>

        <div class="lyrics-sidebar">
          <div class="lyrics-card">
            <h6 class="text-white-50 fw-bold border-bottom border-secondary pb-2 mb-3">
              🎤 Live Lyrics
            </h6>
            <div class="lyrics-container" id="lyricsContainer">
              <p class="text-white-50 mt-5 small">Memuat lirik...</p>
            </div>
          </div>
        </div>
      </div>

      <div class="history-section" id="historySection" style="display: none">
        <div
          class="d-flex justify-content-between align-items-end mb-3 border-bottom border-secondary pb-2"
        >
          <h6 class="text-white-50 mb-0 fw-bold">🕒 Terakhir Diputar</h6>
          <button
            class="btn btn-sm btn-link text-danger text-decoration-none p-0 fw-bold"
            id="clearHistoryBtn"
          >
            Bersihkan
          </button>
        </div>
        <div id="historyList"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
